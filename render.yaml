services:
  - type: web
    runtime: static
    name: tcgai-costapp-1
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Proxy the API through this origin so the session cookie is first-party
      # (a cross-subdomain SameSite=None cookie is blocked by third-party-cookie
      # blocking). Must stay above the SPA catch-all. VITE_API_URL must be unset.
      - type: rewrite
        source: /api/*
        destination: https://tcgai-costapp-24lh.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  # C4a: hourly alert-rule evaluation. NOTE: this cron needs the same env as
  # the backend web service -- set DATABASE_URL (required) and
  # SLACK_ALERTS_WEBHOOK_URL (incoming webhook for #p-agent-operations-platform;
  # alerts are recorded in the DB even when it is unset) on this service in
  # the Render dashboard. Render does not let a cron service inherit env vars
  # from the web service automatically.
  - type: cron
    name: tcgai-costapp-alerts
    runtime: python
    buildCommand: pip install -r backend/tcgai_backend/requirements.txt
    startCommand: cd backend/tcgai_backend && python manage.py evaluate_alerts
    # Daily (Prof's call, 2026-10-16): the rules are windowed over days,
    # so hourly checks bought nothing at this app's volume.
    schedule: "30 8 * * *"

  # Daily auto-audit sweep: grades completed conversations that the
  # ingest-time check could not (its 30-minute quiet gate can't pass at
  # the moment a message arrives, and nothing re-checked afterwards).
  # Volume is a handful of chats/day, so daily is plenty; the command
  # is completion-gated and capped (default limit 25/run). Once the AI
  # intent classifier lands (score_and_classify_chat), the same sweep
  # also upgrades outcome labels with AI intent. NOTE: like the alerts
  # cron, this service needs its env set in the Render dashboard --
  # DATABASE_URL and ANTHROPIC_API_KEY. Render does not let a cron
  # service inherit env vars from the web service automatically.
  - type: cron
    name: tcgai-costapp-auto-audit
    runtime: python
    buildCommand: pip install -r backend/tcgai_backend/requirements.txt
    startCommand: cd backend/tcgai_backend && python manage.py auto_audit_chats
    schedule: "0 8 * * *"
